name: Publish AI-Workflow v0.2.0 alpha release

on:
  push:
    branches:
      - main
    paths:
      - releases/v0.2.0.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'massimilianonardi-ai/ai-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
      - name: Create GitHub pre-release and version tag exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: v0.2.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it."
            exit 0
          fi
          gh release create "$VERSION" \
            --title "AI-Workflow v0.2.0 (alpha)" \
            --notes-file releases/v0.2.0.md \
            --target "$GITHUB_SHA" \
            --prerelease
