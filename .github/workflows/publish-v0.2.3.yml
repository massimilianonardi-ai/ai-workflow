name: Publish AI-Workflow v0.2.3 alpha release

on:
  push:
    branches: [main]
    paths: [releases/v0.2.3.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'massimilianonardi-ai/ai-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable v0.2.3 alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: v0.2.3
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 0
          fi
          gh release create "$VERSION" \
            --title "AI-Workflow v0.2.3 (alpha)" \
            --notes-file releases/v0.2.3.md \
            --target "$GITHUB_SHA" \
            --prerelease
