# AI-Workflow alpha-dev — open, multi-label MDM routing catalog.
# Modality/effects are hints, NEVER authority. No forced match.
version: 3
status: alpha_dev
dimensions:
  operation: [research, design, develop, diagnose, validate, operate, other]
  input: [text, structured, image, audio, video, other]
  output: [text, document, code, structured, image, audio, video, other]
  effects: [read, artifact_write, environment_change]

# Only real, present workflow definitions belong here.
workflow_routes:
  design: workflows/system-design.md

# Other families have methods but NO completed phase workflow in this alpha.
# A request may combine multiple families without inventing another workflow.
method_fallbacks:
  research: [behavior/research.md, behavior/evidence.md]
  develop: [behavior/specification.md, behavior/execution.md, behavior/evidence.md]
  diagnose: [behavior/diagnosis.md, behavior/evidence.md]
  validate: [behavior/review.md, behavior/evidence.md]
  operate: [behavior/execution.md, behavior/decisions.md]
  other: [behavior/intent.md]

rules:
  - outcome_and_scope_before_labels
  - continuity_controller_before_rerouting
  - open_set_and_multi_label
  - input_and_output_are_distinct
  - modalities_select_capabilities_not_workflow_alone
  - no_implicit_permission_from_effects
  - unknown_requires_focused_resolution_only_if_material
  - no_automatic_implementation_from_design
  - do_not_resolve_missing_workflow_refs_by_guessing
