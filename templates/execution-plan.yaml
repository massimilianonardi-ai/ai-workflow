# Immutable, optional execution-plan revision template.
# Store as tasks/<stable-task-id>/plans/plan-NNN.yaml in the configured state repository.
# Never overwrite an existing published revision. This is a plan, not permission to execute.
id: "plan-001"
task: "task:<owner-stable-logical-id>"
revision: 1
supersedes: null  # or "plans/plan-000.yaml"
steps: []  # ordered existing, verified task IDs, not promises that tasks already exist
parallel_groups: []  # groups of existing task IDs; canonical depends_on still applies
completion_gates: []  # owner-specific acceptance/verification gates
# Descriptive future work can be kept in the owning task specification;
# it must not be represented as an already-persisted task ID.
